<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith's CYB102 Study App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #eaf4ff;
      font-family: Arial, sans-serif;
      color: #183153;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 40px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(50, 100, 150, 0.12);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #60758d;
      line-height: 1.6;
    }

    .emoji {
      font-size: 50px;
    }

    button {
      margin-top: 20px;
      border: none;
      background: #8bb8f5;
      color: white;
      padding: 13px 25px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="emoji">📚✨</div>

    <h1>Faith's CYB102 Study App</h1>

    <p>
      Welcome to my CYB102 theory exam study app.
      Built by Faith Adedeji 💙
    </p>

    <button onclick="alert('GitHub Pages is working! 🎉')">
      Test App
    </button>
  </div>

</body>
  </html>
